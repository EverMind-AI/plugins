version: 2

updates:
  # GitHub Actions used by integration verification workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # DeepSeek Harness plugin dependencies
  - package-ecosystem: npm
    directory: /dsh
    schedule:
      interval: weekly
    groups:
      dsh-deps:
        patterns: ["*"]

  # Langfuse replay and fixture verification dependencies
  - package-ecosystem: pip
    directory: /langfuse
    schedule:
      interval: weekly
    groups:
      langfuse-deps:
        patterns: ["*"]
