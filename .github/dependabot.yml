version: 2

updates:
  # GitHub Actions used by integration verification workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # DeepSeek Harness plugin dependencies
  - package-ecosystem: npm
    directory: /dsh
    schedule:
      interval: weekly
    groups:
      dsh-deps:
        patterns: ["*"]
